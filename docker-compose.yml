version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
    working_dir: /app
    networks:
      - app-network
    command: yarn start  # or whatever your backend start command is

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    working_dir: /app
    depends_on:
      - backend
    networks:
      - app-network
    command: yarn start  # or yarn dev if using Next.js etc.

networks:
  app-network:
    driver: bridge
